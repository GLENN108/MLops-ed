[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-ed"
version = "0.1.0"
dependencies = [
    "numpy>=1.22,<2.6",
    "pandas>1.5,<3",
    "scikit-learn>=1.8,<2",
    "fg-data-profiling>=4.20,<5",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
streamlit = ["streamlit"]

[project.scripts]
mlops-api = "server.main:app"
